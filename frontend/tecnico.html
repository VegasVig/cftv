<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Técnico — Vegas Vigilância</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tech-body">

<div class="tech-header">
  <div class="logo">
    <img src="../assets/logo-vegas.png" alt="Vegas"
      onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="fallback" style="display:none">V</div>
    <div class="brand"><b>Vegas Vigilância</b><span>Acesso Técnico CFTV</span></div>
  </div>
  <div class="tit">Acesso Técnico CFTV</div>
</div>

<div class="tech-wrap" id="wrap">
  <div style="text-align:center;padding:60px 0"><div class="spinner" style="margin:0 auto"></div></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lbimg" src=""></div>

<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let timer=null;

const token = new URLSearchParams(location.search).get('t');

function expired(msg){
  if(timer) clearInterval(timer);
  $('wrap').innerHTML = `<div class="expired">
    <div class="ico">⏱️</div><h2>${msg||'Este link expirou.'}</h2>
    <p>Solicite um novo acesso à central de monitoramento.</p></div>`;
}

async function load(){
  if(!token){ expired('Link inválido.'); return; }
  try{
    const r = await api('tecnico', { token });
    if(!r.ok){
      const map = {EXPIRADO:'Este link expirou.',REVOGADO:'Este acesso foi revogado.',
        INVALIDO:'Link inválido.',SEM_TOKEN:'Link inválido.',NAO_ENCONTRADO:'Cliente não encontrado.'};
      expired(map[r.error]||'Este link não está mais disponível.');
      return;
    }
    render(r.cliente, new Date(r.expiraEm));
  }catch(e){ expired('Erro de conexão. Tente novamente.'); }
}

function render(c, expira){
  const di = (k,val)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${escapeHTML(val||'—')}</div></div>`;
  $('wrap').innerHTML = `
    <div class="tech-timer-bar">
      <div class="lbl">Este acesso expira em</div>
      <div class="timer" id="timer" style="font-size:26px;margin-top:4px">--:--</div>
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Cliente</div>
      <div class="detail-grid">
        ${di('Número', c.NumeroCliente)}${di('Nome', c.Nome)}
        ${di('Endereço', c.Endereco)}
      </div>
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Equipamento</div>
      <div class="detail-grid">
        ${di('Marca', c.Marca)}${di('Modelo', c.Modelo)}${di('Tipo', c.Tipo)}
        ${di('Canais', c.Canais)}${di('Câmeras instaladas', c.CamerasInstaladas)}${di('Câmeras funcionando', c.CamerasFuncionando)}
        ${di('IP / URL', c.IP_URL)}${di('Porta', c.Porta)}
      </div>
      ${c.ObsTecnicas?`<div style="margin-top:12px">${di('Obs. técnicas', c.ObsTecnicas)}</div>`:''}
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Credenciais</div>
      <div class="cred-box">
        <div class="cred-row"><div class="k">Usuário</div><div class="val">${escapeHTML(c.UsuarioCFTV||'—')}</div></div>
        <div class="cred-row"><div class="k">Senha</div>
          <div class="val" id="senhaVal" data-real="${escapeHTML(c.SenhaCFTV||'')}">••••••••</div></div>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn secondary sm" onclick="toggleSenha()">Mostrar senha</button>
          <button class="btn secondary sm" onclick="copiar()">Copiar senha</button>
        </div>
      </div>
    </div>

    ${c.Foto?`<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px">
      <div class="section-title">Foto do sistema</div>
      <div class="photo-frame" onclick="ampliar()"><img id="foto" src="${c.Foto}"></div>
    </div>`:''}
  `;
  startTimer(expira);
}

function startTimer(expira){
  const tick=()=>{
    const t=$('timer'); if(!t) return;
    const diff=Math.floor((expira-new Date())/1000);
    if(diff<=0){ expired('Este link expirou.'); return; }
    const m=String(Math.floor(diff/60)).padStart(2,'0'), s=String(diff%60).padStart(2,'0');
    t.textContent=`${m}:${s}`;
    t.className='timer'+(diff<300?' warn':'');
  };
  tick(); timer=setInterval(tick,1000);
}
function toggleSenha(){
  const el=$('senhaVal'), real=el.getAttribute('data-real');
  if(el.textContent==='••••••••'){ el.textContent=real||'—'; event.target.textContent='Ocultar senha'; }
  else { el.textContent='••••••••'; event.target.textContent='Mostrar senha'; }
}
function copiar(){ navigator.clipboard.writeText($('senhaVal').getAttribute('data-real')||''); event.target.textContent='Copiado!'; setTimeout(()=>event.target.textContent='Copiar senha',1500); }
function ampliar(){ $('lbimg').src=$('foto').src; $('lightbox').classList.add('show'); }

load();
</script>
</body>
</html>
