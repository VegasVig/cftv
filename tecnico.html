<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso Técnico — Vegas Vigilância</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tech-body">

<div class="tech-header">
  <div class="logo">
    <img src="./assets/logo-vegas.png" alt="Vegas"
      onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
    <div class="fallback" style="display:none">V</div>
    <div class="brand"><b>Vegas Vigilância</b><span>Acesso Técnico CFTV</span></div>
  </div>
  <div class="tit">Acesso Técnico CFTV</div>
</div>

<div class="tech-wrap" id="wrap">
  <div style="text-align:center;padding:60px 0"><div class="spinner" style="margin:0 auto"></div></div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('show')"><img id="lbimg" src=""></div>

<script src="js/config.js"></script>
<script>
const $ = id => document.getElementById(id);
function escapeHTML(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let timer=null;

const token = new URLSearchParams(location.search).get('t');

function expired(msg){
  if(timer) clearInterval(timer);
  $('wrap').innerHTML = `<div class="expired">
    <div class="ico">⏱️</div><h2>${msg||'Este link expirou.'}</h2>
    <p>Solicite um novo acesso à central de monitoramento.</p></div>`;
}

async function load(){
  if(!token){ expired('Link inválido.'); return; }
  try{
    const r = await api('tecnico', { token });
    if(!r.ok){
      const map = {EXPIRADO:'Este link expirou.',REVOGADO:'Este acesso foi revogado.',
        INVALIDO:'Link inválido.',SEM_TOKEN:'Link inválido.',NAO_ENCONTRADO:'Cliente não encontrado.'};
      expired(map[r.error]||'Este link não está mais disponível.');
      return;
    }
    render(r.cliente, new Date(r.expiraEm));
  }catch(e){ expired('Erro de conexão. Tente novamente.'); }
}

function render(c, expira){
  const di = (k,val)=>`<div class="detail-item"><div class="k">${k}</div><div class="v">${escapeHTML(val||'—')}</div></div>`;
  const fotos = Array.isArray(c.FotosList)&&c.FotosList.length ? c.FotosList : (c.Foto?[c.Foto]:[]);
  $('wrap').innerHTML = `
    <div class="tech-timer-bar">
      <div class="lbl">Este acesso expira em</div>
      <div class="timer" id="timer" style="font-size:26px;margin-top:4px">--:--</div>
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Cliente</div>
      <div class="detail-grid">
        ${di('Número', c.NumeroCliente)}${di('Nome', c.Nome)}
        ${di('Endereço', c.Endereco)}
      </div>
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Equipamento</div>
      <div class="detail-grid">
        ${di('Marca', c.Marca)}${di('Modelo', c.Modelo)}${di('Tipo', c.Tipo)}
        ${di('Canais', c.Canais)}${di('Câmeras instaladas', c.CamerasInstaladas)}${di('Câmeras funcionando', c.CamerasFuncionando)}
        ${di('IP / URL', c.IP_URL)}${di('Porta', c.Porta)}
      </div>
      ${c.ObsTecnicas?`<div style="margin-top:12px">${di('Obs. técnicas', c.ObsTecnicas)}</div>`:''}
    </div>

    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px">
      <div class="section-title">Credenciais</div>
      <div class="cred-box no-copy">
        <div class="cred-row"><div class="k">Usuário</div>
          <div class="val secret" id="userVal">••••••••</div></div>
        <div class="cred-row"><div class="k">Senha</div>
          <div class="val secret" id="senhaVal">••••••••</div></div>
        <p class="cred-hint">🔒 Toque e segure em <b>Ver</b> para revelar. A cópia e a captura estão bloqueadas por segurança.</p>
        <div style="display:flex;gap:8px;margin-top:6px">
          <button class="btn secondary sm reveal-btn" id="btnReveal">Ver credenciais</button>
        </div>
      </div>
    </div>

    ${fotos.length?`<div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px">
      <div class="section-title">Fotos do sistema${fotos.length>1?' ('+fotos.length+')':''}</div>
      <div class="fotos-grid">
        ${fotos.map((src,i)=>`<div class="foto-thumb" onclick="ampliarSrc('${src.replace(/'/g,"\\'")}')"><img src="${src}"></div>`).join('')}
      </div>
    </div>`:''}
  `;

  // Guarda os valores reais fora do DOM visível.
  _cred = { user: c.UsuarioCFTV||'—', pass: c.SenhaCFTV||'—' };
  setupReveal();
  startTimer(expira);
}

let _cred = { user:'', pass:'' };
let _revealTimer = null;

/* Só revela enquanto o dedo/mouse está pressionado no botão. Ao soltar, oculta. */
function setupReveal(){
  const btn = $('btnReveal'); if(!btn) return;
  const show = ()=>{
    $('userVal').textContent = _cred.user;
    $('senhaVal').textContent = _cred.pass;
    $('userVal').classList.add('revealed');
    $('senhaVal').classList.add('revealed');
    // Auto-oculta após 15s como rede de segurança.
    clearTimeout(_revealTimer);
    _revealTimer = setTimeout(hide, 15000);
  };
  const hide = ()=>{
    $('userVal').textContent = '••••••••';
    $('senhaVal').textContent = '••••••••';
    $('userVal').classList.remove('revealed');
    $('senhaVal').classList.remove('revealed');
    clearTimeout(_revealTimer);
  };
  // pressionar-e-segurar (toque e mouse)
  btn.addEventListener('mousedown', show);
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); show(); }, {passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>btn.addEventListener(ev, hide));
}
function ampliarSrc(src){ $('lbimg').src=src; $('lightbox').classList.add('show'); }

function startTimer(expira){
  const tick=()=>{
    const t=$('timer'); if(!t) return;
    const diff=Math.floor((expira-new Date())/1000);
    if(diff<=0){ expired('Este link expirou.'); return; }
    const m=String(Math.floor(diff/60)).padStart(2,'0'), s=String(diff%60).padStart(2,'0');
    t.textContent=`${m}:${s}`;
    t.className='timer'+(diff<300?' warn':'');
  };
  tick(); timer=setInterval(tick,1000);
}
function toggleSenha(){/* substituído por pressionar-e-segurar (setupReveal) */}

/* ===== Proteções anti-captura / anti-cópia ===== */
(function protecoes(){
  // Bloqueia menu de contexto (botão direito / segurar).
  document.addEventListener('contextmenu', e=>e.preventDefault());
  // Bloqueia seleção e cópia.
  document.addEventListener('selectstart', e=>e.preventDefault());
  document.addEventListener('copy', e=>{ e.preventDefault(); });
  document.addEventListener('cut', e=>{ e.preventDefault(); });
  document.addEventListener('dragstart', e=>e.preventDefault());

  // Bloqueia atalhos comuns de print/salvar/devtools.
  document.addEventListener('keyup', e=>{ if(e.key==='PrintScreen') limparClipboard(); });
  document.addEventListener('keydown', e=>{
    const k = (e.key||'').toLowerCase();
    if(e.key==='PrintScreen') { limparClipboard(); }
    // Ctrl/Cmd + P (imprimir), S (salvar), C (copiar), U (fonte)
    if((e.ctrlKey||e.metaKey) && ['p','s','c','u'].includes(k)){ e.preventDefault(); esconderTudo(); }
    // F12 / Ctrl+Shift+I (devtools)
    if(e.key==='F12' || ((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='i')){ e.preventDefault(); esconderTudo(); }
  });

  // Ao sair da aba/app ou perder foco (momento típico de screenshot), escurece.
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) blackout(true); else blackout(false); });
  window.addEventListener('blur', ()=>blackout(true));
  window.addEventListener('focus', ()=>blackout(false));

  function limparClipboard(){
    try{ navigator.clipboard.writeText(' '); }catch(_){}
    esconderTudo();
  }
})();

/* Reoculta credenciais imediatamente. */
function esconderTudo(){
  const u=$('userVal'), s=$('senhaVal');
  if(u){ u.textContent='••••••••'; u.classList.remove('revealed'); }
  if(s){ s.textContent='••••••••'; s.classList.remove('revealed'); }
}

/* Cortina preta sobre a tela (impede screenshot útil quando sai do app). */
function blackout(on){
  let el = document.getElementById('blackout');
  if(!el){
    el = document.createElement('div'); el.id='blackout';
    el.innerHTML = '<div>🔒 Conteúdo protegido<br><small>Volte ao aplicativo para visualizar</small></div>';
    document.body.appendChild(el);
  }
  el.classList.toggle('show', !!on);
  if(on) esconderTudo();
}

load();
</script>
</body>
</html>
