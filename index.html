<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vegas Vigilância e Segurança — Sistema de CFTV</title>
<script src="js/tema.js?v=20261007c"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261007c">
</head>
<body class="login-body">
<div class="login-page">
  <main class="login-stage">

    <!-- Marca à esquerda -->
    <section class="brand-col" aria-hidden="true">
      <img class="emblem" src="assets/emblema-vegas.png" alt="">
      <img class="wordmark" src="assets/wordmark-vegas.png" alt="">
      <div class="tagline">VIGILÂNCIA E SEGURANÇA</div>
      <div class="beam"></div>
      <div class="slogan">TECNOLOGIA E SEGURANÇA<br>SEMPRE AO SEU LADO</div>
    </section>

    <!-- Card de acesso -->
    <section class="login-card hud" aria-labelledby="tituloLogin">
      <div class="card-brand">
        <img class="emblem" src="assets/emblema-vegas.png" alt="Vegas Vigilância e Segurança"
             onerror="this.style.display='none'">
        <div class="brand">
          <img class="wordmark" src="assets/wordmark-vegas.png" alt="VEGAS">
          <span>Vigilância e segurança</span>
        </div>
      </div>
      <h1 class="rule-title" id="tituloLogin" style="font-size:15px;font-weight:500">Sistema de CFTV</h1>

      <div id="alert" class="alert err" role="alert"></div>

      <div class="field">
        <label for="usuario">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c0-4.1 3.6-6.8 8-6.8s8 2.7 8 6.8z"/></svg>
          Usuário
        </label>
        <div class="input-ico">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 20.5c0-4.1 3.6-6.8 8-6.8s8 2.7 8 6.8z"/></svg>
          <input id="usuario" type="text" autocomplete="username" placeholder="Digite seu usuário">
        </div>
      </div>

      <div class="field">
        <label for="senha">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 6 10zm2 0h6V7.5a3 3 0 0 0-6 0z"/></svg>
          Senha
        </label>
        <div class="input-ico">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10V7.5a5 5 0 0 1 10 0V10h1a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 18 21H6a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 6 10zm2 0h6V7.5a3 3 0 0 0-6 0z"/></svg>
          <input id="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha">
          <button type="button" class="eye" id="btnOlho" aria-label="Mostrar senha" onclick="alternarSenha()">
            <svg id="olhoIco" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="21" x2="21" y2="3"/></svg>
          </button>
        </div>
      </div>

      <button class="btn lg" id="btnEntrar" onclick="entrar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        ENTRAR
      </button>
    </section>

    <div class="spacer-col"></div>
  </main>

  <!-- Diferenciais -->
  <footer class="features">
    <ul>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 9.5 13 5l8 3.5-10 4.5z"/><path d="M3 9.5v5L11 18l10-4.5v-5"/><path d="M11 13v5"/><circle cx="16.5" cy="12.2" r="1.3"/></svg>
        <span>Monitoramento<br>24 horas</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 2v20" /><path d="M12 5.2 17.5 7.3V12c0 3.8-4 6.6-5.5 7.5z" fill="currentColor" opacity=".35" stroke="none"/></svg>
        <span>Mais segurança<br>para o seu patrimônio</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span>Tecnologia<br>de ponta</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="19" height="13" rx="1.5"/><path d="M8 21h8M12 16.5V21"/><rect x="5" y="6" width="14" height="8" fill="currentColor" opacity=".3" stroke="none"/></svg>
        <span>Imagens em<br>tempo real</span>
      </li>
    </ul>
    <div class="signature"><b>VEGAS</b> VIGILÂNCIA E SEGURANÇA</div>
  </footer>
</div>

<div class="loading" id="loading"><div class="spinner"></div></div>

<script src="js/config.js?v=20261007c"></script>
<script>
  if (localStorage.getItem('vegas_session')) location.href = 'dashboard.html';

  const $ = id => document.getElementById(id);
  function showErr(msg){ const a=$('alert'); a.textContent=msg; a.style.display='block'; }

  function alternarSenha(){
    const inp=$('senha'), mostrar = inp.type==='password';
    inp.type = mostrar ? 'text' : 'password';
    $('btnOlho').setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
    $('olhoIco').querySelector('line').style.display = mostrar ? 'none' : '';
  }

  async function entrar(){
    const usuario = $('usuario').value.trim();
    const senha = $('senha').value;
    if(!usuario || !senha){ showErr('Preencha usuário e senha.'); return; }
    $('alert').style.display='none';
    $('loading').classList.add('show');
    $('btnEntrar').disabled = true;
    try{
      const r = await api('login', { usuario, senha });
      if(r.ok){
        localStorage.setItem('vegas_session', r.session);
        localStorage.setItem('vegas_nome', r.nome || usuario);
        location.href = 'dashboard.html';
      }else{
        showErr(r.error==='CREDENCIAIS_INVALIDAS' ? 'Usuário ou senha incorretos.' : 'Não foi possível entrar. Verifique a configuração da API.');
      }
    }catch(e){
      showErr('Erro de conexão com o servidor. Confira a URL da API em config.js.');
    }finally{
      $('loading').classList.remove('show');
      $('btnEntrar').disabled = false;
    }
  }
  $('usuario').addEventListener('keydown', e=>{ if(e.key==='Enter') $('senha').focus(); });
  $('senha').addEventListener('keydown', e=>{ if(e.key==='Enter') entrar(); });
</script>
</body>
</html>
